services:
  db:
    image: postgres:16-alpine
    container_name: simulador-presupuesto-jsf-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: simulador_presupuesto
      POSTGRES_USER: simulador
      POSTGRES_PASSWORD: simulador
    ports:
      - "5432:5432"
    volumes:
      - simulador_presupuesto_jsf_data:/var/lib/postgresql/data

  adminer:
    image: adminer:latest
    container_name: simulador-presupuesto-jsf-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      - db

volumes:
  simulador_presupuesto_jsf_data:
