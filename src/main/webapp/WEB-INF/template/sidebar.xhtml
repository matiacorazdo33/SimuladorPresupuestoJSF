<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets">
    <aside class="sidebar">
        <div class="sidebar__marca">
            <div class="sidebar__logo">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 3v18h18"></path>
                    <path d="M18.7 8 13 13.7l-3-3L4 17"></path>
                </svg>
            </div>
            <div>
                <div class="sidebar__nombre-app">FinFlow</div>
                <div class="sidebar__subtitulo-app">Simulador de Presupuesto</div>
            </div>
        </div>

        <nav class="sidebar__nav">
            <h:link outcome="/menu.xhtml" styleClass="sidebar__enlace #{view.viewId == '/menu.xhtml' ? 'activo' : ''}">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="7" height="7" rx="1"></rect>
                    <rect x="14" y="3" width="7" height="7" rx="1"></rect>
                    <rect x="3" y="14" width="7" height="7" rx="1"></rect>
                    <rect x="14" y="14" width="7" height="7" rx="1"></rect>
                </svg>
                Menú
            </h:link>
            <h:link outcome="/movimientoForm.xhtml" styleClass="sidebar__enlace">
                <f:param name="tipo" value="ingreso"/>
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 5v14"></path>
                    <path d="M19 12l-7 7-7-7"></path>
                </svg>
                Registrar ingreso
            </h:link>
            <h:link outcome="/movimientoForm.xhtml" styleClass="sidebar__enlace">
                <f:param name="tipo" value="gasto"/>
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 19V5"></path>
                    <path d="M5 12l7-7 7 7"></path>
                </svg>
                Registrar gasto
            </h:link>
            <h:link outcome="/saldo.xhtml" styleClass="sidebar__enlace #{view.viewId == '/saldo.xhtml' ? 'activo' : ''}">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                    <path d="M14 2v6h6"></path>
                    <path d="M9 13h6"></path>
                    <path d="M9 17h6"></path>
                </svg>
                Historial
            </h:link>
            <h:link outcome="/presupuesto.xhtml" styleClass="sidebar__enlace #{view.viewId == '/presupuesto.xhtml' ? 'activo' : ''}">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="9"></circle>
                    <path d="M12 7v5l3 3"></path>
                </svg>
                Presupuesto
            </h:link>
            <h:link outcome="/arcade.xhtml" styleClass="sidebar__enlace #{view.viewId.startsWith('/arcade') ? 'activo' : ''}">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="6" width="20" height="12" rx="2"></rect>
                    <path d="M7 10v4"></path>
                    <path d="M5 12h4"></path>
                    <circle cx="16" cy="10.5" r="0.6" fill="currentColor"></circle>
                    <circle cx="18" cy="13.5" r="0.6" fill="currentColor"></circle>
                </svg>
                Zona Arcade
            </h:link>

            <h:panelGroup rendered="#{authBean.usuarioActual.esAdmin()}">
                <hr class="sidebar__separador"/>
                <h:link outcome="/admin/panel.xhtml" styleClass="sidebar__enlace #{view.viewId.startsWith('/admin/') ? 'activo' : ''}">
                    <f:param name="vista" value="dashboard"/>
                    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2 3 6v6c0 5 4 8 9 10 5-2 9-5 9-10V6z"></path>
                    </svg>
                    Administración
                </h:link>
            </h:panelGroup>
        </nav>

        <div class="sidebar__footer">
            <div class="sidebar__usuario">
                <strong>#{authBean.usuarioActual.nombre}</strong>
                <span>#{authBean.usuarioActual.correo}</span>
            </div>
            <h:form>
                <h:commandButton value="Cerrar sesión" action="#{authBean.cerrarSesionYRedirigir}" styleClass="sidebar__logout"/>
            </h:form>
        </div>
    </aside>
</ui:composition>
