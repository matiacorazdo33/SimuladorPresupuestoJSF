<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                template="/WEB-INF/template/layout.xhtml">
    <ui:define name="titulo">Zona Arcade · FinFlow</ui:define>

    <ui:define name="contenido">
        <div class="pagina__encabezado">
            <h1 class="pagina__titulo">Zona Arcade</h1>
            <p class="pagina__subtitulo">Aprende jugando y gana XP para canjear en la tienda</p>
        </div>

        <h:messages globalOnly="true" layout="table" styleClass="alerta alerta-exito" style="width:100%"/>

        <div class="arcade-stats">
            <div class="arcade-stat">
                <div class="arcade-stat__icono arcade-stat__icono--xp">
                    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2l2.9 6 6.6.6-5 4.4 1.5 6.5L12 16l-5.9 3.5L7.5 13l-5-4.4 6.5-.6z"></path>
                    </svg>
                </div>
                <div>
                    <div class="arcade-stat__etiqueta">XP</div>
                    <strong>#{arcadeBean.xp}</strong>
                </div>
            </div>
            <div class="arcade-stat">
                <div class="arcade-stat__icono arcade-stat__icono--vidas">
                    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"></path>
                    </svg>
                </div>
                <div>
                    <div class="arcade-stat__etiqueta">Vidas (Laberinto)</div>
                    <strong>#{arcadeBean.vidas}</strong>
                </div>
            </div>
            <div class="arcade-stat">
                <div class="arcade-stat__icono arcade-stat__icono--bono">
                    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="9"></circle>
                        <path d="M12 7v10"></path>
                        <path d="M15 9.5c0-1.4-1.3-2.5-3-2.5s-3 1-3 2.2 1.3 1.8 3 2.1 3 .9 3 2.1-1.3 2.1-3 2.1-3-1-3-2.3"></path>
                    </svg>
                </div>
                <div>
                    <div class="arcade-stat__etiqueta">Bono Ciudad del Ahorro</div>
                    <strong><h:outputText value="#{arcadeBean.bono}"><f:convertNumber type="currency" currencySymbol="$"/></h:outputText></strong>
                </div>
            </div>
        </div>

        <div class="tarjeta__etiqueta" style="margin-bottom: 10px;">Minijuegos</div>
        <div class="arcade-grid">
            <ui:repeat value="#{arcadeBean.catalogo}" var="j">
                <h:link outcome="/arcadeJuego.xhtml" styleClass="arcade-card">
                    <f:param name="juego" value="#{j.id}"/>

                    <div class="arcade-card__icono arcade-card__icono--#{j.icono}">
                        <h:panelGroup rendered="#{j.icono == 'quiz'}">
                            <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="9"></circle>
                                <path d="M9.5 9a2.5 2.5 0 0 1 5 0c0 1.5-2 1.8-2 3.5"></path>
                                <path d="M12 17h.01"></path>
                            </svg>
                        </h:panelGroup>
                        <h:panelGroup rendered="#{j.icono == 'gasto'}">
                            <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="10.5" cy="10.5" r="6.5"></circle>
                                <path d="M20 20l-4.35-4.35"></path>
                            </svg>
                        </h:panelGroup>
                        <h:panelGroup rendered="#{j.icono == 'ahorro'}">
                            <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M19 9a4 4 0 0 0-4-4H9a5 5 0 0 0-5 5c0 2 1 3 2 4v3h3v-2h4v2h3v-3.3c1-.5 2-1.5 2-2.7"></path>
                                <circle cx="15" cy="9" r=".6" fill="currentColor" stroke="none"></circle>
                                <path d="M5 10H3"></path>
                            </svg>
                        </h:panelGroup>
                        <h:panelGroup rendered="#{j.icono == 'simulador'}">
                            <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M4 6h16"></path>
                                <circle cx="9" cy="6" r="2"></circle>
                                <path d="M4 12h16"></path>
                                <circle cx="16" cy="12" r="2"></circle>
                                <path d="M4 18h16"></path>
                                <circle cx="11" cy="18" r="2"></circle>
                            </svg>
                        </h:panelGroup>
                        <h:panelGroup rendered="#{j.icono == 'retos'}">
                            <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M5 21V4"></path>
                                <path d="M5 4h13l-2.5 4L18 12H5"></path>
                            </svg>
                        </h:panelGroup>
                        <h:panelGroup rendered="#{j.icono == 'ciudad'}">
                            <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M3 21h18"></path>
                                <path d="M5 21V9l5-4 5 4v12"></path>
                                <path d="M15 21v-7h4v7"></path>
                                <path d="M9 9h.01"></path>
                                <path d="M9 13h.01"></path>
                                <path d="M9 17h.01"></path>
                            </svg>
                        </h:panelGroup>
                        <h:panelGroup rendered="#{j.icono == 'laberinto'}">
                            <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="3" width="18" height="18" rx="2"></rect>
                                <path d="M3 9h9V3"></path>
                                <path d="M12 21v-8h9"></path>
                                <path d="M8 9v6h8"></path>
                            </svg>
                        </h:panelGroup>
                    </div>

                    <div class="arcade-card__texto">
                        <strong>#{j.nombre}</strong>
                        <small>#{j.descripcion}</small>
                    </div>

                    <svg class="arcade-card__chevron" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 18l6-6-6-6"></path>
                    </svg>
                </h:link>
            </ui:repeat>
        </div>

        <div class="tarjeta__etiqueta" style="margin: 26px 0 10px;">Tienda (canjea tu XP)</div>
        <div class="tienda-grid">
            <ui:repeat value="#{arcadeBean.tienda}" var="item">
                <div class="tienda-card">
                    <div class="tienda-card__icono">
                        <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"></path>
                            <path d="M3 6h18"></path>
                            <path d="M16 10a4 4 0 0 1-8 0"></path>
                        </svg>
                    </div>
                    <strong>#{item.nombre}</strong>
                    <small>#{item.descripcion}</small>
                    <div class="costo">#{item.costoXp} XP</div>
                    <h:form>
                        <h:commandButton value="Canjear" styleClass="btn btn-fantasma mt-24"
                                          action="#{arcadeBean.canjear(item.id)}"/>
                    </h:form>
                </div>
            </ui:repeat>
        </div>
    </ui:define>
</ui:composition>
